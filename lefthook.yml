pre-commit:
  commands:
    # By content type, so a script in bin/ is linted for what it is, whatever its name.
    shellcheck:
      file_types: [text/x-shellscript, text/x-sh]
      run: mise x -- shellcheck {staged_files}
    shfmt:
      file_types: [text/x-shellscript, text/x-sh]
      run: mise x -- shfmt -d -i 2 -ci {staged_files}
    ruff:
      glob: "*.py"
      run: mise x -- ruff check {staged_files}
    # Extensionless Python scripts in bin/, found by their shebang.
    ruff-scripts:
      file_types: text/x-python
      run: mise x -- ruff check {staged_files}
    taplo:
      glob: "*.toml"
      run: mise x -- taplo fmt --check {staged_files}
    prettier:
      glob:
        - "*.md"
        - "*.json"
        - "*.{yml,yaml}"
      run: mise x -- prettier --check {staged_files}

pre-push:
  commands:
    check:
      run: mise x -- just check
