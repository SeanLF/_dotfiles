; Model presets for `ccl` (bin/ccl), read by llama-server in router mode.
;
; A section name IS the model id: it is what `ccl -m` takes and what reaches
; llama-server as the "model" field, so keep them short. Adding a model is a
; stanza here, not a change to ccl.
;
; The router loads a model on first request and unloads to stay under
; --models-max, so switching models needs no restart. Restart only after
; editing this file: `ccl --restart`.
;
; Format is llama.cpp's own preset INI and is NOT fully standardised across
; versions; keys have been renamed before. Pinned against llama.cpp 0.3.0
; (build 10621); re-test with `llama-server --models-preset <this> --port 40115`
; after upgrading.

[*]
; 128K, measured on this M4 Pro against qwen: 23.6 GiB RSS at this size, of
; which 21.3 is weights, so the KV cache is only ~2.3 GiB. That leaves ~15 GiB
; under the Metal working-set ceiling, which reports as 40200 MB.
;
; KV is that cheap because qwen35moe is hybrid-attention (ssm.* keys and a
; full_attention_interval in the GGUF): most layers keep a constant-size
; recurrent state rather than a per-token KV, so the cache barely grows with
; context. Guidance that extrapolates KV linearly from a short context
; overestimates this badly; it predicted ~12 GiB against the 2.3 measured.
; Re-measure rather than extrapolate before raising this for a new model; a
; conventional-GQA model of this size would not fit at 128K.
ctx-size = 131072
; Concurrency, not a division of the window; but ONLY because kv-unified is
; set below. llama.cpp enables a unified KV buffer by default just when the slot
; count is auto, so naming parallel explicitly silently turns it off and then
; ctx-size is split across the slots: this pair without kv-unified served 32768,
; not 131072. Set the two together or neither.
;
; ccl reads this back off the router's resolved argv and hands it to Claude Code
; as CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS, which otherwise defaults to 20
; against these 4.
parallel   = 4
kv-unified = 1
; Pins the current default so a future flip cannot swap a model's own chat
; template, and its tool-call framing, for a generic one. Tool use through
; /v1/messages needs it.
jinja = 1

; 35B total, 3B active. The small active count is what holds the speed: 48.54
; tok/s generation and 749.69 tok/s prompt, against 12.04 for the dense
; Qwen3.8-27B of comparable quality. Do not reach for a "Flash" model to beat
; it; DeepSeek-V4-Flash and GLM-5.3-Flash are 284B and 320B total, and their
; smallest quants (71 GB, 92 GB) are ~2x the Metal ceiling above.
;
; The -MTP- repo carries multi-token-prediction heads, but do not add
; spec-type = draft-mtp: measured here it cost 12.7% throughput at 73% draft
; acceptance, and an independent 19-config benchmark found no net speedup for
; A3B MoE on CUDA either. Generation is already cheap at 3B active, so the
; draft overhead never pays for itself.
[qwen]
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL

[gemma]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
